# Production environment logging configuration
iqkv:
  logging:
    structured: true
    correlation-id: true
    tracing: true
    application-log-level: INFO
    spring-log-level: WARN
    database-log-level: WARN
    performance-logging: true
    slow-operation-threshold-ms: 5000
    security-logging: true
    business-event-logging: true

logging:
  level:
    root: INFO
    com.iqkv.sample.bookingdemandapietl: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
    org.apache.http: WARN
  file:
    path: /var/log/app
    name: ${spring.application.name:app}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB

# Minimal actuator endpoints for production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized