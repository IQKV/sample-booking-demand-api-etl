# Development environment logging configuration
iqkv:
  logging:
    structured: false
    correlation-id: true
    tracing: true
    application-log-level: DEBUG
    spring-log-level: INFO
    database-log-level: DEBUG
    performance-logging: true
    slow-operation-threshold-ms: 1000
    security-logging: true
    business-event-logging: true

logging:
  level:
    root: INFO
    com.iqkv.sample.bookingdemandapietl: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%15.15t]){blue} %clr(%-5p){magenta} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  file:
    path: ./logs
    name: ${spring.application.name:app}

# Enable Spring Boot actuator for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,logfile
  endpoint:
    loggers:
      enabled: true